name: Deploy Produção (VPS)

# Disparo manual: a publicação ocorre somente quando alguém executa Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-check:
    name: Checar build (Backend + Frontend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Node.js no Backend
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Instalar dependências do Backend
        working-directory: Backend
        run: npm ci

      - name: Executar testes do Backend
        working-directory: Backend
        run: npm test

      - name: Instalar Node.js no Frontend
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Instalar dependências do Frontend
        working-directory: Frontend
        run: npm ci

      - name: Executar lint do Frontend
        working-directory: Frontend
        run: npm run lint

      - name: Buildar Frontend
        working-directory: Frontend
        run: npm run build

  deploy:
    name: Deploy na VPS
    needs: build-check
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Conectar à rede privada Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          ping: ${{ secrets.VPS_HOST }}

      - name: Conectar na VPS e publicar
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script_stop: true
          envs: GITHUB_SHA
          script: |
            set -e
            cd /home/ubuntu/apps/App-controle-financeiro

            if [ -n "$(git status --porcelain)" ]; then
              echo "A publicação foi interrompida: existem alterações locais na VM."
              git status --short
              exit 1
            fi

            git fetch --prune origin main
            git pull --ff-only origin main

            if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
              echo "A revisão da VM não corresponde ao commit validado pelo build-check."
              exit 1
            fi

            docker compose up -d --build
            curl --fail --silent --show-error --retry 10 --retry-delay 2 http://127.0.0.1:8091/ >/dev/null
            curl --fail --silent --show-error --retry 10 --retry-delay 2 http://127.0.0.1:3011/api/health >/dev/null
