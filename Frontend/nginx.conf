server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cabeçalhos de segurança, inclusive o Content-Security-Policy (ver
    # nginx/cabecalhos-seguranca.conf). Atenção: no nginx, um location com
    # add_header próprio NÃO herda os add_header do server — por isso o include
    # se repete nos locations que definem Cache-Control. Antes, só o /sw.js
    # recebia estes cabeçalhos; o index.html e os assets saíam sem nenhum.
    include /etc/nginx/cabecalhos-seguranca.conf;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/javascript application/json
               image/svg+xml font/woff2 application/font-woff2;

    # O navegador precisa consultar o service worker a cada acesso para detectar
    # uma versão nova. "expires epoch" impede que proxies e o navegador mantenham
    # uma cópia antiga, sem remover a herança dos cabeçalhos de segurança acima.
    location = /sw.js {
        expires epoch;
        try_files $uri =404;
    }

    # Arquivos gerados pelo build do Vite têm hash no nome (ex: index-a1b2c3.js),
    # então podem ser cacheados "pra sempre" pelo navegador — se o conteúdo mudar,
    # o nome do arquivo muda junto.
    location /assets/ {
        include /etc/nginx/cabecalhos-seguranca.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Essencial pro React Router funcionar: qualquer rota que não seja um
    # arquivo real (ex: /despesas, /relatorio) cai de volta no index.html,
    # e o React Router decide o que mostrar no lado do cliente. Sem isso,
    # atualizar a página numa rota interna dá 404 no Nginx.
    location / {
        include /etc/nginx/cabecalhos-seguranca.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
