# Cabeçalhos de segurança de todas as respostas. Os marcadores __...__ são
# preenchidos no build da imagem por scripts/gerar-cabecalhos-nginx.mjs:
#   __HASHES_SCRIPTS_INLINE__  hash SHA-256 de cada <script> inline do
#                              index.html gerado (o script do tema)
#   __ORIGEM_API__             origem do VITE_API_URL (a API fica em outro domínio)
#
# style-src precisa de 'unsafe-inline' porque React e Recharts usam o
# atributo style; scripts, por outro lado, só do próprio domínio ou pelo hash.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' __HASHES_SCRIPTS_INLINE__; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' __ORIGEM_API__; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
