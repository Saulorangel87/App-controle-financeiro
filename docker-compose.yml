services:
  backend:
    build: ./Backend
    container_name: despesas-backend
    restart: unless-stopped
    # tini como PID 1: repassa o SIGTERM do "docker compose up/down" ao Node,
    # que encerra na hora em vez de esperar 10 s e levar SIGKILL.
    init: true
    # O entrypoint sobe como root só para acertar o dono de /app/data e já
    # troca para o usuário "node"; daí em diante nada pode ganhar privilégio.
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_REMETENTE=${EMAIL_REMETENTE}
      - BACKUP_DIR=${BACKUP_DIR:-/app/data/backups}
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-30}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - APP_TIMEZONE=${APP_TIMEZONE:-America/Sao_Paulo}
      - PORT=3001
    volumes:
      # Persiste o banco SQLite fora do container, senão os dados somem
      # a cada rebuild da imagem.
      - ./Backend/data:/app/data
    ports:
      - "3011:3001"

  frontend:
    build:
      context: ./Frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: despesas-frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    ports:
      - "8091:80"
    depends_on:
      - backend
